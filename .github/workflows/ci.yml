name: Reliability CI

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

env:
  REDIS_URL: redis://localhost:6379/0
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Start Redis exactly like grader
        run: |
          make docker-up
          for attempt in {1..10}; do
            if docker compose exec -T redis redis-cli ping | grep -q PONG; then
              echo "Redis is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Rubric test counts
        run: |
          mkdir -p reports
          : > reports/rubric-test-output.txt
          set -o pipefail
          pytest -q tests/test_circuit_breaker.py | tee -a reports/rubric-test-output.txt
          pytest -q tests/test_cache.py | tee -a reports/rubric-test-output.txt
          pytest -q tests/test_gateway_contract.py | tee -a reports/rubric-test-output.txt
          pytest -q tests/test_redis_cache.py | tee -a reports/rubric-test-output.txt
          pytest -q tests/test_todo_requirements.py | tee -a reports/rubric-test-output.txt
          grep -q "12 passed" reports/rubric-test-output.txt
          grep -q "9 passed" reports/rubric-test-output.txt
          grep -q "4 passed" reports/rubric-test-output.txt
          grep -q "6 passed" reports/rubric-test-output.txt
          grep -q "7 xpassed" reports/rubric-test-output.txt

      - name: Full bonus tests with Redis enabled
        run: |
          mkdir -p reports
          set -o pipefail
          pytest -q tests/test_redis_circuit_breaker.py | tee reports/redis-circuit-test-output.txt
          grep -q "3 passed" reports/redis-circuit-test-output.txt
          ! grep -qi "skipped" reports/redis-circuit-test-output.txt
          pytest -q tests/test_budget_routing.py tests/test_bonus_config.py tests/test_bonus_evidence.py | tee reports/bonus-test-output.txt
          grep -q "9 passed" reports/bonus-test-output.txt
          ! grep -qi "skipped" reports/bonus-test-output.txt

      - name: Full make test with Redis enabled
        run: |
          mkdir -p reports
          set -o pipefail
          make test | tee reports/test-output.txt
          grep -Eq "[0-9]+ passed, 7 xpassed" reports/test-output.txt
          ! grep -qi "failed" reports/test-output.txt
          ! grep -qi "skipped" reports/test-output.txt

      - name: Generate chaos evidence exactly like grader
        run: make run-chaos

      - name: Generate final report exactly like grader
        run: make report

      - name: Validate grader artifacts and full bonus checklist
        run: |
          test -s docker-compose.yml
          test -s reports/metrics.json
          test -s reports/metrics.csv
          test -s reports/cache_comparison.json
          test -s reports/concurrent_metrics.json
          test -s reports/redis_evidence.json
          test -s reports/bonus_evidence.json
          test -s reports/final_report.md
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          metrics = json.loads(Path("reports/metrics.json").read_text())
          required = {
              "availability",
              "error_rate",
              "latency_p50_ms",
              "latency_p95_ms",
              "latency_p99_ms",
              "fallback_success_rate",
              "cache_hit_rate",
              "circuit_open_count",
              "recovery_time_ms",
              "estimated_cost_saved",
              "scenarios",
          }
          missing = required - metrics.keys()
          assert not missing, f"missing metrics: {sorted(missing)}"
          assert metrics["circuit_open_count"] > 0
          assert metrics["recovery_time_ms"] is not None
          assert len(metrics["scenarios"]) >= 3
          assert all(status == "pass" for status in metrics["scenarios"].values())

          redis_evidence = json.loads(Path("reports/redis_evidence.json").read_text())
          assert redis_evidence["available"] is True
          assert redis_evidence["shared_response"] == "shared cache evidence response"
          assert redis_evidence["score"] == 1.0
          assert redis_evidence["keys"], "Redis key evidence is empty"

          bonus = json.loads(Path("reports/bonus_evidence.json").read_text())
          distributed = bonus["distributed_circuit_breaker"]
          for key in [
              "available",
              "opened_by_instance_a",
              "observed_open_by_instance_b",
              "first_probe_acquired",
              "second_probe_blocked",
              "observed_closed_by_instance_b",
          ]:
              assert distributed[key] is True, key
          assert distributed["instance_a_final_state"] == "closed"
          assert distributed["instance_b_final_state"] == "closed"
          for reason in [
              "failure_threshold_reached",
              "reset_timeout_elapsed",
              "probe_success",
          ]:
              assert reason in distributed["transition_reasons"], reason

          cost = bonus["cost_aware_routing"]
          assert cost["switch_ratio"] == 0.8
          assert cost["below_80_percent"]["provider"] == "primary"
          assert cost["below_80_percent"]["route"] == "primary"
          assert cost["at_80_percent"]["provider"] == "backup"
          assert cost["at_80_percent"]["route"] == "fallback"
          assert cost["at_100_percent"]["provider"] is None
          assert cost["at_100_percent"]["route"] == "static_fallback"
          assert cost["at_100_percent"]["error"] == "budget_exhausted"
          assert cost["at_100_percent"]["estimated_cost"] == 0.0

          config = yaml.safe_load(Path("configs/default.yaml").read_text())
          assert config["circuit_breaker"]["backend"] == "memory"
          assert config["budget"]["enabled"] is False
          assert config["budget"]["switch_ratio"] == 0.8

          report = Path("reports/final_report.md").read_text()
          assert "TODO" not in report
          assert "Chu Nguyễn Tuấn Anh" in report
          assert "2A202601755" in report
          assert "reset_timeout_seconds = 2" in report
          for heading in [
              "Architecture summary",
              "Configuration",
              "SLO definitions",
              "Cache comparison",
              "Redis shared cache",
              "Redis CLI output",
              "Chaos scenarios",
              "Stretch goals — complete bonus evidence",
              "Failure analysis",
          ]:
              assert heading in report, heading
          assert 'redis-cli KEYS "rl:cache:*"' in report

          stretch_labels = [
              "ThreadPoolExecutor concurrent load",
              "Redis shared circuit-breaker state",
              "Redis cache graceful degradation",
              "Cost-aware routing at 80%/100%",
              "Hypothesis circuit-breaker fuzzing",
              "SLO table and validation",
          ]
          report_lines = report.splitlines()
          for label in stretch_labels:
              rows = [line for line in report_lines if line.startswith(f"| {label} |")]
              assert len(rows) == 1, f"missing/duplicate stretch row: {label}"
              assert "| PASS |" in rows[0], rows[0]

          print("core grader checklist + all six stretch goals validated")
          PY

      - name: Upload grading evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-lab-evidence
          path: |
            reports/test-output.txt
            reports/rubric-test-output.txt
            reports/redis-circuit-test-output.txt
            reports/bonus-test-output.txt
            reports/metrics.json
            reports/metrics.csv
            reports/cache_comparison.json
            reports/concurrent_metrics.json
            reports/redis_evidence.json
            reports/bonus_evidence.json
            reports/final_report.md
          if-no-files-found: warn

      - name: Stop Redis
        if: always()
        run: make docker-down
